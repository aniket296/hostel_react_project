{% extends 'base/admin_base.html' %}

{% block title %}Edit Clerk{% endblock %}

{% block content %}
<h1 class="page-title">Edit Clerk</h1>

<div class="panel">
    <div class="panel-header">Clerk Update Form</div>
    <div class="panel-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="action-btn" type="submit">Update Clerk</button>
        </form>
    </div>
</div>
{% endblock %}
