{% extends 'base/admin_base.html' %}

{% block title %}Admin Profile{% endblock %}

{% block content %}
<h1 class="page-title">Admin Profile</h1>

<div class="panel">
    <div class="panel-header">Profile Information</div>
    <div class="panel-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="action-btn" type="submit">Update Profile</button>
        </form>
    </div>
</div>
{% endblock %}
