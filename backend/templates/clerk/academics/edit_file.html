{% extends 'base/clerk_base.html' %}

{% block title %}Edit Academic File{% endblock %}

{% block content %}
<div style="padding: 30px;">
    <h1>Edit Academic File</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <p>
            <label>Subject</label>
            {{ form.subject_name }}
        </p>
        <div>
            <label>Course Code</label>
            {{ form.course_code }}
            {% if form.course_code.errors %}
                <div class="form-error">{{ form.course_code.errors }}</div>
            {% endif %}
        </div>
        {{ form.as_p }}
        <button type="submit">Update File</button>
    </form>
</div>
{% endblock %}
