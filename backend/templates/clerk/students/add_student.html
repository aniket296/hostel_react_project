{% extends 'base/clerk_base.html' %}

{% block title %}Add Student{% endblock %}

{% block content %}
<h1 class="page-title">Add Student</h1>

<div class="panel">
    <div class="panel-header">Student Registration Form</div>
    <div class="panel-body">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="action-btn" type="submit">Create Student</button>
        </form>
    </div>
</div>
{% endblock %}
